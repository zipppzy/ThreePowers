# [[attacks]]
# name = "Attack Name"                   # Required: Display name
# baseDuration = 500                     # Required: Duration in ticks (1 tick = 1 game second; at timeScale 500 a duration of 500 is about 1 real second)
# damageType = "physical"                # Required: physical | qi | mana | psychic
# baseDamage = 10.0                      # Required: Damage before armor resolution
# range = "melee"                        # Required: melee | ranged | either
#
# All other Action fields (requirements, skillRewards, tags, etc.) work the same as action_database.toml

